# nginx configuration for the report browser and the /statistica page.
#
# Replaces the image's stock conf.d/default.conf. Two things are added on top of
# plain static serving:
#   1. a JSON access log (stats.log) that main.py parses to build /statistica;
#   2. a no-content endpoint (/_e) the page pings for events that would
#      otherwise leave no trace in the log.
#
# The site sits behind Cloudflare, so the socket peer is always a Cloudflare
# edge address: the visitor's real IP and country come from the CF-* request
# headers instead. cf-ipcity is only present when the "Add visitor location
# headers" managed transform is enabled in the Cloudflare dashboard; when it is
# missing main.py falls back to a local GeoIP database (GEOIP_DB_PATH).

# Prefer the IP Cloudflare reports; fall back to the socket peer so the log is
# still meaningful if the site is ever reached without the proxy in front.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# JSON so the parser never has to deal with quoting rules. Field names are kept
# short because this file grows one line per request.
log_format stats escape=json
    '{"t":"$time_iso8601",'
    '"ip":"$client_ip",'
    '"cc":"$http_cf_ipcountry",'
    '"city":"$http_cf_ipcity",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"ref":"$http_referer",'
    '"ua":"$http_user_agent",'
    # Tells an inline <img> load ("image") apart from a click on a download
    # link ("document"): the chart is embedded in every report, so without this
    # the two are the same request. Absent on browsers too old to send it.
    '"dest":"$http_sec_fetch_dest"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers: an absolute one would be rebuilt as http:// on
    # port 80 and send visitors of the HTTPS site through a pointless downgrade.
    absolute_redirect off;

    # Timestamps must be UTC to match the reports; the container sets TZ=UTC.
    access_log /var/log/nginx/stats.log stats;
    # Keep `docker compose logs web` readable as well.
    access_log /dev/stdout main;

    # Event beacon. Nothing is served and nothing is stored here: the request
    # URL itself is the datum, and it is recorded by the access_log above.
    # Used for outbound link clicks, which open another site and so would never
    # show up in our own log.
    location /_e {
        return 204;
    }

    # Unlisted statistics page (no link points at it, and it is excluded from
    # its own numbers). Never cache it: it is regenerated on a timer.
    # "^~" so the regex location below cannot steal these headers.
    location ^~ /statistica/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # Reports are rewritten in place (latest.md) and the index is regenerated on
    # every run, so the browser must not serve a stale copy.
    #
    # The source files (chart image, bulletin text) never change once written,
    # but they are listed here too: image extensions are in Cloudflare's default
    # cacheable set, so without an explicit no-cache the edge would answer those
    # requests itself and they would never reach this access log, leaving
    # /statistica to undercount every chart opened. no-cache still allows a
    # conditional request, so the cost is a 304 rather than a re-download — and
    # the 304 is logged, hence counted.
    location ~* \.(md|html|txt|png|jpe?g|gif|webp)$ {
        add_header Cache-Control "no-cache" always;
    }
}
